<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форма регистрации</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="page">
    <section class="registration">
      <h1 class="registration__title">Регистрация</h1>
      <p class="registration__desc">Заполните поля, чтобы создать новый аккаунт</p>

      <form class="registration__form" action="https://postman-echo.com/post" method="POST">
        <div class="field">
          <label class="field__label" for="first-name">Имя</label>
          <input class="field__input" type="text" id="first-name" name="first_name" required placeholder="Введите ваше имя">
        </div>

        <div class="field">
          <label class="field__label" for="last-name">Фамилия</label>
          <input class="field__input" type="text" id="last-name" name="last_name" required placeholder="Введите вашу фамилию">
        </div>

        <div class="field">
          <label class="field__label" for="email">Электронная почта</label>
          <input class="field__input" type="email" id="email" name="email" required placeholder="example@mail.com">
        </div>

        <div class="field">
          <label class="field__label" for="password">Пароль</label>
          <input class="field__input" type="password" id="password" name="password" required placeholder="Придумайте пароль">
        </div>

        <div class="field">
          <label class="field__label" for="password-confirm">Подтверждение пароля</label>
          <input class="field__input" type="password" id="password-confirm" name="password_confirm" required placeholder="Повторите пароль">
        </div>

        <div class="field-checkbox">
          <input class="field-checkbox__input" type="checkbox" id="terms" name="terms" required>
          <label class="field-checkbox__label" for="terms">Я согласен с условиями использования сервиса</label>
        </div>

        <button class="registration__btn" type="submit">Создать аккаунт</button>
      </form>
    </section>
  </main>

</body>
</html>
